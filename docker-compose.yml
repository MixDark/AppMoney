version: "3.9"

services:

  # ============================================================
  # MYSQL - BASE DE DATOS EXISTENTE
  # ============================================================
  mysql:
    image: mysql:8.4

    container_name: mysql-appmoney

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Bogota

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - appmoney

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ============================================================
  # APPMONEY
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: appmoney_app

    restart: unless-stopped

    expose:
      - "7700"

    environment:

      # Flask
      FLASK_ENV: ${FLASK_ENV}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}

      # MySQL
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_POOL_SIZE: ${DB_POOL_SIZE}

      # Servidor
      SERVER_HOST: ${SERVER_HOST}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_THREADS: ${SERVER_THREADS}

      # Zona horaria
      TZ: America/Bogota

    volumes:
      - profiles_data:/app/interface/static/images/profiles
      - logs_data:/app/logs

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - proxy
      - appmoney

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7700/', timeout=5)\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


# ============================================================
# NETWORKS
# ============================================================

networks:

  proxy:
    external: true

  appmoney:
    driver: bridge


# ============================================================
# VOLUMES
# ============================================================

volumes:

  mysql_data:
    name: appmoney_mysql_prod

  profiles_data:
    name: appmoney_profiles_prod

  logs_data:
    name: appmoney_logs_prod