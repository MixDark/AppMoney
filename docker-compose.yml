version: "3.8"

services:
  app:
    image: appmoney:latest
    container_name: appmoney_app_prod
    restart: always
    depends_on:
      - mysql-appmoney  # Espera a que MySQL esté listo
    volumes:
      - profiles_data:/app/interface/static/images/profiles
      - logs_data:/app/logs
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      # CORREGIDO: Usar el nombre correcto del contenedor MySQL
      - DB_HOST=mysql-appmoney
      - DB_USER=${DB_USER:-appuser}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-appmoney_db}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-7700}
      - SERVER_THREADS=${SERVER_THREADS:-4}
      - TZ=America/Bogota
    ports:
      - "${HOST_PORT:-7700}:7700"
    networks:
      - appmoney-network  # CAMBIADO: Usar la misma red que MySQL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  appmoney-network:  # CAMBIADO: Usar la red existente de MySQL
    external: true
    name: appmoney-network

volumes:
  profiles_data:
    name: appmoney_profiles_prod
  logs_data:
    name: appmoney_logs_prod